<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <title>404 — Страница не найдена</title>
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <div class="logo-icon"></div>
        <span class="logo-text">Баночный массаж</span>
      </a>
      <div class="lang-selector">
        <button class="lang-btn" data-lang="ru">RU</button>
        <button class="lang-btn" data-lang="tj">TJ</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">☀</button>
    </div>
  </header>

  <section class="error-page">
    <div class="container">
      <div class="fade-in visible">
        <div class="error-code" data-i18n="404.code">404</div>
        <h1 data-i18n="404.title">Страница не найдена</h1>
        <p data-i18n="404.desc">К сожалению, такой страницы не существует. Вернитесь на главную или свяжитесь с нами в WhatsApp.</p>
        <div class="hero-buttons" style="justify-content:center">
          <a href="index.html" class="btn btn-primary btn-lg" data-i18n="404.btn.home">На главную</a>
          <a href="#" class="btn btn-secondary btn-lg" data-wa="general" data-i18n="404.btn.whatsapp">Написать в WhatsApp</a>
        </div>
      </div>
    </div>
  </section>

  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
